<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NpuStudio</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:16px}h1{font-size:1.3em}
.card{background:#1d1d1d;border-radius:12px;padding:12px;margin:10px 0}input,button{font-size:1em;padding:8px;border-radius:8px;border:0}
button{background:#76b900;color:#111}#st{white-space:pre-line}</style></head>
<body><h1>NpuStudio <small id="ver"></small></h1>
<div class="card">Placeholder UI served by the desktop. The full mobile UI comes later.</div>
<div class="card"><label>Pairing key <input id="key" type="password"></label> <button onclick="save()">Connect</button></div>
<div class="card" id="st">Not connected.</div>
<script>
// Native shell bridge (Android WebView): window.NpuShell may provide pickImage(), share(b64,name), download(b64,name), notify(title,text)
const API = location.origin + "/api/v1";
const key = () => localStorage.getItem("npukey") || "";
function save(){ localStorage.setItem("npukey", document.getElementById("key").value.trim()); poll(); }
async function poll(){
  try{ const r = await fetch(API + "/health", {headers:{"X-Key": key()}});
    const d = await r.json(); document.getElementById("st").textContent = r.ok ?
      `Desktop ${d.name} online\nGPU ${d.gpu}: ${d.use ?? "N/A"}%  ${d.watts ?? "N/A"} W  ${d.temp ?? "N/A"}°C` : "Wrong pairing key";
  }catch(e){ document.getElementById("st").textContent = "Desktop offline"; }
}
fetch("version.json").then(r=>r.json()).then(v=>document.getElementById("ver").textContent="UI "+v.ui_version);
document.getElementById("key").value = key(); if(key()) poll(); setInterval(()=>key()&&poll(), 5000);
</script></body></html>
